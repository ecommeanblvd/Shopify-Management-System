api_version = "2026-04"

# Block extensions cho customer account: profile block + order-status block.
# Tách riêng khỏi full-page (customer-account-hub) theo yêu cầu của Shopify.

[[extensions]]
type = "ui_extension"
name = "Customer Account Blocks"
handle = "customer-account-blocks"
uid = "customer-account-blocks"
description = "MEAN customer account blocks: profile block + order-status block."

  [[extensions.targeting]]
  target = "customer-account.profile.block.render"
  module = "./src/ProfileBlock.tsx"

  [[extensions.targeting]]
  target = "customer-account.order-status.block.render"
  module = "./src/OrderStatusBlock.tsx"

  [extensions.capabilities]
  network_access = true

  [extensions.settings]
    [[extensions.settings.fields]]
    key = "backend_url"
    type = "single_line_text_field"
    name = "SMS backend URL"
    description = "Base URL của SMS (vd https://shopify-management-system-production.up.railway.app)."
